name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.403'

      - name: Publish self-contained Windows app
        run: ./build.ps1

      - name: Check settings persistence and source migration
        run: dotnet run --project tests/BabbleFrameBridge.Tests -c Release -- --settings-only

      - name: Check persistent eye and face module assignments
        run: dotnet run --project tests/BabbleFrameBridge.ChannelSelection.Tests -c Release

      - name: Check native avatar routing across discovery failures
        run: dotnet run --project tests/Avatar.Router.Tests -c Release

      - name: Check SteamVR startup registration and session lifecycle
        run: dotnet run --project tests/SteamVR.Tests -c Release

      - name: Check local kitty neural policy and behavior recovery
        run: dotnet run --project tests/Kitty.Tests -c Release

      - name: Check articulated kitty spring stability
        run: dotnet run --project tests/Kitty.Spring.Tests -c Release

      - name: Check silent kitty captions and expiry
        run: dotnet run --project tests/Kitty.Caption.Tests -c Release

      - name: Check kitty panel geometry and pickup bounds
        run: dotnet run --project tests/Kitty.Panel.Tests -c Release

      - name: Check module download validation and cancellation
        run: dotnet run --project tests/BabbleFrameBridge.Download.Tests -c Release

      - name: Build custom SDK module fixture
        run: dotnet build tests/Fixtures/BabbleBridge.CustomModule.Fixture -c Release -o work/custom-fixture

      - name: Check custom module hosting and dependency failures
        run: python tests/custom_module_integration_test.py --worker dist/BabbleFrameBridge/runtime/BabbleFrameBridge.Worker.exe --module-dll work/custom-fixture/BabbleBridge.CustomModule.Fixture.dll

      - name: Check simultaneous module ownership, recovery and shutdown
        run: dotnet run --project tests/BabbleBridge.MultiSource.Tests -c Release -- --worker dist/BabbleFrameBridge/runtime/BabbleFrameBridge.Worker.exe

      - name: Check pupil normalization
        run: dotnet run --project tests/EyeData.Tests -c Release

      - name: Check Baballonia Expressions Alpha eye and face input
        run: |
          $moduleZip = Join-Path $env:RUNNER_TEMP 'Baballonia-Expressions-Alpha-3.2.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/Project-Babble/Baballonia/releases/download/vrcft-module-3.2.0/VRCFaceTracking.Baballonia.zip' -OutFile $moduleZip
          if ((Get-FileHash -LiteralPath $moduleZip -Algorithm SHA256).Hash -ne '1501bcf8ed1a8fb0b9d8e166ab1c95ab838c4e33d09524f2f537bf6f87d8c032') {
            throw 'The official Expressions Alpha module changed; verify its publisher and update the pinned checksum before testing.'
          }
          python tests/provider_integration_test.py --worker dist/BabbleFrameBridge/runtime/BabbleFrameBridge.Worker.exe --baballonia-alpha-zip $moduleZip
          $bfrModuleZip = Join-Path $env:RUNNER_TEMP 'Babble-BFR-Module-4.0.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/Project-Babble/Baballonia/releases/download/vrcft-module-4.0.0/VRCFaceTracking.Baballonia.zip' -OutFile $bfrModuleZip
          if ((Get-FileHash -LiteralPath $bfrModuleZip -Algorithm SHA256).Hash -ne 'cdf6fbf3bdc115e4863f230a70e005ed10f772b754934016c8a9ba0b16630b90') {
            throw 'The official BFR module changed; verify its publisher and update the pinned checksum before testing.'
          }

      - name: Check module library transactions and transient directory locks
        run: dotnet run --project tests/BabbleFrameBridge.Tests -c Release -- "$env:RUNNER_TEMP/Babble-BFR-Module-4.0.0.zip"

      - name: Verify component license texts and distribution exclusions
        run: python tests/check_distribution_licenses.py --publish-dir dist/BabbleFrameBridge

      - name: Check native protocol and avatar message parsing
        run: dotnet run --project tests/BabbleFrameBridge.NativeFace.Tests -c Release

      - name: Check themes and independent module downloads
        run: dotnet run --project tests/BabbleFrameBridge.Appearance.Tests -c Release -- --publish-dir dist/BabbleFrameBridge --module-zip "$env:RUNNER_TEMP/Babble-BFR-Module-4.0.0.zip" --baballonia-alpha-zip "$env:RUNNER_TEMP/Baballonia-Expressions-Alpha-3.2.0.zip"

      - name: Check OSC cadence, concurrency and stationary gaze refresh
        run: dotnet run --project tests/BabbleBridge.Sending.Tests -c Release

      - name: Verify distribution notices and separate-module packaging
        run: |
          $payload = Join-Path $PWD 'dist/BabbleFrameBridge'
          foreach ($file in @('BabbleFrameBridge.exe', 'runtime/BabbleFrameBridge.Worker.exe', 'Assets/Brand/FaceTrackingBridge-headset-v2.ico', 'START-HERE.txt', 'LICENSE', 'NOTICE.txt', 'THIRD_PARTY_NOTICES.md', 'licenses/VRCFaceTracking-LICENSE.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $payload $file) -PathType Leaf)) {
              throw "Missing distribution file: $file"
            }
          }
          $module = Get-ChildItem -LiteralPath $payload -Recurse -File | Where-Object {
            $_.Name -in @('VRCFaceTracking.Baballonia.dll', 'VirtualDesktop.FaceTracking.dll', 'SteamLinkVRCFTModule.dll') -or
            ($_.Extension -eq '.zip' -and $_.Name -like '*Baballonia*')
          }
          if ($module) { throw 'The application must not include a Baballonia tracking module.' }
          $copiedRuntime = Get-ChildItem -LiteralPath $payload -Recurse -File -Filter 'vcruntime140.dll'
          if ($copiedRuntime) { throw 'Install the official Visual C++ runtime separately; do not package a DLL copied from Windows.' }

      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FaceTrackingBridge-Windows-x64
          path: dist/BabbleFrameBridge/
          if-no-files-found: error
          retention-days: 14
